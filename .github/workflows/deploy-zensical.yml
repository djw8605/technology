name: Deploy static Zensical pages
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy-zensical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Zensical
        run: pip install -r requirements.txt ghp-import==2.1.0

      - name: Build Zensical pages
        run: zensical build --clean --strict

      # Zensical has no `gh-deploy` command; ghp-import is the tool `mkdocs
      # gh-deploy` used under the hood, so the gh-pages branch keeps the
      # same layout and history.
      - name: Deploy Zensical pages
        if: startsWith(github.repository, 'osg-htc/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          ghp-import --no-jekyll --push \
            --branch gh-pages \
            --message "Deployed ${GITHUB_SHA::9} with Zensical $(zensical --version)" \
            site
