name: Validate static Zensical pages
on: pull_request

jobs:
  validate-zensical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Zensical
        run: pip install -r requirements.txt

      - name: Build Zensical pages
        timeout-minutes: 2
        run: zensical build --clean --strict

      - id: format-github-repo
        run: echo "repo-name=${GITHUB_REPOSITORY#*\/}" >> $GITHUB_OUTPUT

      - name: Test links
        timeout-minutes: 10
        uses: docker://klakegg/html-proofer:3.16.0
        with:
          args: >-
            --allow-hash-href
            --check-html
            --http-status-ignore 302,401,429
            --file-ignore ./site/404.html
            --url-ignore "https://fonts.gstatic.com,/github.com\/osg-htc\/${{ steps.format-github-repo.outputs.repo-name }}\/edit/,/osg-htc.org\/${{ steps.format-github-repo.outputs.repo-name }}/,https://operations-portal.egi.eu/broadcast/archive/2293,https://bodhi.fedoraproject.org/updates/FEDORA-EPEL-2020-a4bf7c5d9c,https://docs.fedoraproject.org/en-US/packaging-guidelines/,https://ggus.eu/,/koji.osg-htc.org/,/koji.opensciencegrid.org/,/slack.com/,/adaptivecomputing.com/,/manpages.ubuntu.com/"
            ./site
